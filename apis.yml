    url: authentication/nivoda-authentication.yml
- name: Nivoda Diamonds GraphQL API (Staging)
  description: >-
    Staging / sandbox GraphQL endpoint mirroring production, with a GraphiQL
    explorer for browsing queries and mutations and testing code. Staging
    username and password are shared on request by a Nivoda account manager.
