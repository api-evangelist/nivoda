apis:
- name: Nivoda Diamonds GraphQL API (Production)
  description: >-
    Public GraphQL API for verified Nivoda customers to search live natural and
    lab-grown diamond, gemstone and jewelry inventory, retrieve real-time
    pricing, certificates and media, and (with Pro access) place orders, holds,
    diamond requests and concierge requests. Returns only the fields requested.
  humanURL: https://bitbucket.org/nivoda/nivoda-api/src/main/
  baseURL: https://integrations.nivoda.net/api/diamonds
