name: Nivoda
description: >-
  Nivoda is a global B2B marketplace for the diamond, gemstone and jewelry
  trade, connecting jewelry retailers directly with suppliers of natural and
  lab-grown diamonds, colored gemstones, melee and made-to-order finished
  jewelry without the retailer having to hold stock. The platform provides
  real-time pricing, high-resolution imagery and video, advanced search and
  quality control, consolidated shipping and invoicing, flexible credit terms
  and risk-free returns. Nivoda exposes a public GraphQL API that verified
  customers use to integrate live supplier inventory into their own websites and
  storefronts, mirroring the same search capabilities as the Nivoda platform and
  mobile apps, with Pro access adding orders, holds, diamond requests and
  concierge requests.
